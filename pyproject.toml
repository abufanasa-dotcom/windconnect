[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "windconnect"
version = "1.0.0"
description = "Local synthetic wind turbine Modbus monitoring and diagnostics"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pymodbus==3.11.4",
    "streamlit==1.66.1",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pyarrow==20.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.4"]

[project.scripts]
windconnect = "windconnect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/windconnect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
